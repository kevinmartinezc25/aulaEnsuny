name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npx tsc --noEmit
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GOOGLE_DRIVE_GAS_URL: ${{ secrets.GOOGLE_DRIVE_GAS_URL }}
        GOOGLE_DRIVE_SECURITY_TOKEN: ${{ secrets.GOOGLE_DRIVE_SECURITY_TOKEN }}
        GOOGLE_DRIVE_DOCS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_DOCS_FOLDER_ID }}

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        GOOGLE_DRIVE_GAS_URL: ${{ secrets.GOOGLE_DRIVE_GAS_URL }}
        GOOGLE_DRIVE_SECURITY_TOKEN: ${{ secrets.GOOGLE_DRIVE_SECURITY_TOKEN }}
        GOOGLE_DRIVE_DOCS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_DOCS_FOLDER_ID }}
